# Rendered by the nginx image entrypoint (envsubst) into /etc/nginx/conf.d/default.conf.
# In k8s, Traefik routes /api/, /hubs/ and /health straight to the backend, so these
# proxy blocks are only used in Compose. The resolver lets nginx start even if the
# backend host does not resolve yet.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;  # from /etc/resolv.conf (Docker DNS or CoreDNS)
    set $backend http://${BACKEND_UPSTREAM};

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # streaming chat responses
        proxy_buffering off;
    }

    location /hubs/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
