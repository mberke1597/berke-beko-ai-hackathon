# Traefik (built into k3s) + cert-manager TLS for ${PUBLIC_HOST} (e.g. beko-demo.swedencentral.cloudapp.azure.com,
# or <public-ip>.sslip.io as a fallback).
# Routing per docs/architecture/contracts.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beko
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<middleware>@kubernetescrd. cert-manager's HTTP-01 solver uses its own
    # Ingress (more specific path), so the challenge is still served over plain HTTP.
    traefik.ingress.kubernetes.io/router.middlewares: beko-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${PUBLIC_HOST}
      secretName: beko-tls
  rules:
    - host: ${PUBLIC_HOST}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
