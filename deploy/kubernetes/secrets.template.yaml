# TEMPLATE ONLY. Never commit real values.
# deploy.yml creates/updates this Secret from GitHub secrets on every deploy.
# Manual equivalent on the VM (values from a password manager):
#
#   kubectl -n beko create secret generic beko-secrets \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=JWT_SIGNING_KEY=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=MONGO_PASSWORD=... \
#     --from-literal=GRAFANA_ADMIN_PASSWORD=... \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Use URL-safe DB passwords (openssl rand -hex 24): they are embedded in connection strings.
apiVersion: v1
kind: Secret
metadata:
  name: beko-secrets
  namespace: beko
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<anthropic-api-key>"
  JWT_SIGNING_KEY: "<random, at least 32 bytes: openssl rand -base64 48>"
  POSTGRES_PASSWORD: "<openssl rand -hex 24>"
  MONGO_PASSWORD: "<openssl rand -hex 24>"
  GRAFANA_ADMIN_PASSWORD: "<openssl rand -hex 16>"
