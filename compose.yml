# Full local stack. Copy .env.example to .env first, then: docker compose up -d --build
# App: http://localhost:8081  Grafana: http://localhost:3000/grafana/  Prometheus: http://localhost:9090
name: beko

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    image: ghcr.io/mberke1597/beko-backend:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: Host=postgres;Database=beko;Username=beko;Password=${POSTGRES_PASSWORD}
      Mongo__ConnectionString: mongodb://beko:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      Mongo__Database: beko
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY}
      Anthropic__DefaultModel: ${ANTHROPIC_DEFAULT_MODEL:-claude-sonnet-5-5}
      Anthropic__FastModel: ${ANTHROPIC_FAST_MODEL:-claude-haiku-5-5}
      Anthropic__MaxTokens: "4096"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: beko-agents
      Jwt__Audience: beko-agents
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: beko-backend
      App__Version: ${APP_VERSION:-0.1.0}
      App__Commit: ${APP_COMMIT:-local}
      App__GrafanaBaseUrl: http://localhost:3000/grafana
    ports: ["5080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      otel-collector: { condition: service_started }
    # Chiseled image has no shell/curl, so health is checked by the frontend/k8s probes.
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    image: ghcr.io/mberke1597/beko-frontend:local
    environment:
      BACKEND_UPSTREAM: backend:8080
    ports: ["8081:80"]
    depends_on: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: beko
      POSTGRES_USER: beko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beko -d beko"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  mongodb:
    image: mongo:8.0.34
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: beko
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: [./monitoring/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [tempo, loki, prometheus]
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"   # local named volume is root-owned
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "0"
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
  mongo-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
