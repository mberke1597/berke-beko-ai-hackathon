name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (build, format, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Beko.Agents.slnx

      - name: Build
        run: dotnet build Beko.Agents.slnx -c Release --no-restore

      - name: Format check
        run: dotnet format Beko.Agents.slnx --verify-no-changes --no-restore

      # global.json selects Microsoft.Testing.Platform, so the solution is passed with --solution.
      - name: Test
        run: dotnet test --solution Beko.Agents.slnx -c Release --no-build

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build (${{ vars.IMAGE_PLATFORM || 'linux/arm64' }}, no push)
    runs-on: ${{ vars.IMAGE_PLATFORM == 'linux/amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          platforms: ${{ vars.IMAGE_PLATFORM || 'linux/arm64' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}-${{ vars.IMAGE_PLATFORM == 'linux/amd64' && 'amd64' || 'arm64' }}
