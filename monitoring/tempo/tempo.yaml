# Grafana Tempo 3.1 monolithic (target: all, no Kafka), local storage, 48h retention.
# Based on the upstream example/docker-compose/single-binary/tempo.yaml for v3.1.1.
target: all
stream_over_http_enabled: true

memory:
  automemlimit_enabled: true   # GOMEMLIMIT from the container memory limit

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# 3.0 removed the compactor; retention runs in the backend scheduler/worker.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 48h
backend_worker:
  compaction:
    block_retention: 48h

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]

usage_report:
  reporting_enabled: false
